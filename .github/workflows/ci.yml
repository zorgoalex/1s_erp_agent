name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore ErpOnecAgent.sln --locked-mode
      - name: Verify formatting
        run: dotnet format ErpOnecAgent.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build ErpOnecAgent.sln -c Release --no-restore
      - name: Test
        run: dotnet test ErpOnecAgent.sln -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"
      - name: Audit NuGet dependencies
        run: dotnet list ErpOnecAgent.sln package --vulnerable --include-transitive --no-restore
      - name: Publish Windows service
        run: dotnet publish src/ErpOnecAgent.Service/ErpOnecAgent.Service.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ErpOnecAgent-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error
